spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/chohj_member
    username: postgres
    password: admin
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:1}
  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            redirect-uri: http://localhost:8081/login/oauth2/code/naver
            authorization-grant-type: authorization_code
            scope: name,email
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
app:
  frontend:
    url: http://localhost:5173
  cookie:
    secure: false # localhost 면 false
    same-site: Lax
    refresh-token-name: refresh_token
auth:
  access-token-secret: ${JWT_SECRET:qkxSN1Y9eZUJN7FrqGrZ1antggnBvfXplgh9T5qOzs29V8DlfCm/pcZKmlsooChcEvSqidmIUmGKy8xjlKUBqg}
  access-token-expiration: 1800000ms      # 30분
  refresh-token-expiration: 604800000ms   # 7일
